name: ci
concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    types: [opened, synchronize]
    branches:
      - '*'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0", "head"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{matrix.ruby}}
          bundler: latest
          bundler-cache: true # zizmor: ignore[cache-poisoning]
      - name: Run tests
        run: bundle exec rake test

  package:
    needs: [ "test" ]
    name: "package (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - "ruby"
          - "aarch64-linux"
          - "aarch64-mingw-ucrt"
          - "amd64-freebsd"
          - "arm64-darwin"
          - "x64-mingw-ucrt"
          - "x86_64-darwin"
          - "x86_64-linux"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm Gemfile.lock
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler: latest
          bundler-cache: true # zizmor: ignore[cache-poisoning]
      - run: "bundle exec rake gem:${{matrix.platform}}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{matrix.platform}}
          path: pkg
          retention-days: 1

  install-ruby:
    name: "install (ruby)"
    needs: [ "package" ]
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.2"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-ruby
          path: pkg
      - run: "gem install pkg/pagefind-*.gem"
      - run: "pagefind 2>&1 | fgrep 'ERROR: Cannot find the pagefind executable'"

  install-native:
    name: "install (${{ matrix.platform }})"
    needs: [ "package" ]
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "4.0" ]
        platform:
          - "aarch64-linux-gnu"
          - "aarch64-linux-musl"
          - "aarch64-mingw-ucrt"
          - "arm64-darwin"
          - "x64-mingw-ucrt"
          - "x86_64-darwin"
          - "x86_64-linux-gnu"
          - "x86_64-linux-musl"
        include:
          - { platform: aarch64-linux-gnu, gem: aarch64-linux, docker_platform: "--platform=linux/arm64/v8" }
          - { platform: aarch64-linux-musl, gem: aarch64-linux, docker_tag: "-alpine", docker_platform: "--platform=linux/arm64/v8", bootstrap: "apk add build-base &&" }
          - { platform: aarch64-mingw-ucrt, runs_on: windows-11-arm }
          - { platform: arm64-darwin, runs_on: macos-15 }
          - { platform: x64-mingw-ucrt, runs_on: windows-latest }
          - { platform: x86_64-darwin, runs_on: macos-15-intel }
          - { platform: x86_64-linux-gnu, gem: x86_64-linux }
          - { platform: x86_64-linux-musl, gem: x86_64-linux, docker_tag: "-alpine", bootstrap: "apk add build-base &&" }
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-${{ matrix.gem || matrix.platform }}
          path: pkg
      - if: ${{ matrix.runs_on }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - if: ${{ matrix.runs_on }}
        run: "gem install pkg/pagefind-*.gem"
      - if: ${{ matrix.runs_on }}
        run: "pagefind --help"
      - if: ${{ (! matrix.runs_on) && matrix.docker_platform }}
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - if: ${{ ! matrix.runs_on }}
        run: |
          docker run --rm -v $PWD:/pagefind-ruby -w /pagefind-ruby \
            ${{ matrix.docker_platform }} ruby:${{ matrix.ruby }}${{ matrix.docker_tag }} \
            sh -c "
              ${{ matrix.bootstrap }}
              gem install pkg/pagefind-*.gem
              pagefind --help
            "

  install-freebsd:
    name: "install (amd64-freebsd)"
    needs: [ "package" ]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gem-amd64-freebsd
          path: pkg
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: "15.1"
      - run: sudo pkg install -y ruby34-gems
      - run: sudo gem install pkg/pagefind-*.gem
      - run: pagefind --help
